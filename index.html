<style>

    --line:#ded5c2; --line2:#ece4d3; --accent:#c8511b; --accent2:#9a3d12;

  button{font-family:inherit;cursor:pointer}

  .brand .b1{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;letter-spacing:-.02em}

  .iconbtn:active{transform:translateY(1px)}
  .live{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);flex:none}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:.3s}

  .tab .cnt{font-size:11px;background:var(--chip);border-radius:999px;padding:1px 6px;color:var(--accent2)}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab.on .cnt{background:var(--accent);color:#fff}
  .tab.tot{border-color:var(--accent);color:var(--accent)}
  .tab.tot.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .pinput{width:64px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font-size:16px;font-family:"IBM Plex Mono";text-align:right;background:#fff;color:var(--ink);flex:none}

  .oprow{display:flex;gap:6px;padding:6px 12px 8px;background:var(--card);border-top:1px solid var(--line2)}
  .opbtn{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 0;font-size:16px;font-family:"IBM Plex Mono";font-weight:600;flex:1}
  .opbtn:active{background:var(--chip)}
  .padd{border:none;background:var(--accent);color:#fff;border-radius:999px;width:28px;height:28px;font-size:18px;display:grid;place-items:center;flex:none;padding:0}
  .padd:active{background:var(--accent2)}
  .eexpr{font-family:"IBM Plex Mono";font-size:14px;flex:1;color:var(--ink)}
  .prow.last{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .dot.offln{background:var(--accent)}
  .prow.flagged{border-color:var(--bad);background:#fdf8f7}
  .pflag{border:none;background:none;font-size:15px;line-height:1;padding:2px 4px;flex:none;color:var(--muted);transition:.12s}
  .pflag.on{color:var(--bad)}
  .tab.recount{border-color:var(--bad);color:var(--bad)}
  .tab.recount.on{background:var(--bad);color:#fff;border-color:var(--bad)}
  .cat-badge{font-size:10px;color:var(--accent2);background:var(--chip);border-radius:5px;padding:1px 5px;margin-left:5px;font-family:"IBM Plex Mono";flex:none}
  .config{margin:40px 16px;background:var(--card);border:1.5px solid var(--bad);border-radius:14px;padding:20px}
  .config h2{font-family:"Bricolage Grotesque";margin:0 0 8px;color:var(--bad)}
  .config code{background:#f1e7d6;padding:1px 5px;border-radius:4px;font-family:"IBM Plex Mono";font-size:12px}
</style>

<script type="text/babel">
const {useState,useEffect,useRef} = React;
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const CFG = window.TALLY_CONFIG;
const CONFIGURED = CFG && CFG.SUPABASE_KEY && !CFG.SUPABASE_KEY.includes("PASTE");
const sb = CONFIGURED ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY) : null;
const POLL_MS = 3000;
const BUILD_ID = "2026-06-05-parser-dual-cat-v2";

function evalExpr(raw){
  const s=String(raw==null?"":raw).trim();
  if(s==="") return {v:0, empty:true};
  if(!/^[-+*/().\d\s]+$/.test(s)) return {v:NaN};
  let i=0; const peek=()=>{ while(s[i]===" ") i++; return s[i]; };
  function expr(){ let v=term(); for(;;){ const c=peek(); if(c==="+"){i++;v+=term();} else if(c==="-"){i++;v-=term();} else return v; } }
  function term(){ let v=fac(); for(;;){ const c=peek(); if(c==="*"){i++;v*=fac();} else if(c==="/"){i++;v/=fac();} else return v; } }
  function fac(){ const c=peek(); if(c==="+"){i++;return fac();} if(c==="-"){i++;return -fac();}
    if(c==="("){i++; const v=expr(); if(peek()===")") i++; return v;} return num(); }
  function num(){ const st=i; while(/[\d.]/.test(s[i])) i++; if(i===st) return NaN; return parseFloat(s.slice(st,i)); }
  try{ const v=expr(); return {v:isFinite(v)?v:NaN}; }catch(e){ return {v:NaN}; }
}
const fmt = n => !isFinite(n) ? "—" : (Math.round(n*1000)/1000).toString();
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"x";
const when = d => { try{ return new Date(d).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}); }catch(e){ return ""; } };

function newClientId(){
  return window.crypto?.randomUUID ? crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
// Inserts are keyed by a client-generated UUID so retries/overlapping flushes collapse into the
// same row (ON CONFLICT DO NOTHING) instead of creating duplicates when an ack is lost offline.
async function upsertCount(row){
  const {data,error}=await sb.from("counts").upsert(row,{onConflict:'client_id',ignoreDuplicates:true}).select();
  if(error) throw error;
  if(data && data.length) return data[0];
  const {data:existing,error:selErr}=await sb.from("counts").select().eq('client_id',row.client_id).single();
  if(selErr) throw selErr;
  return existing;
}

async function parsePdf(file){
  if(!window.pdfjsLib) throw new Error("PDF engine not loaded");
  const buf = await file.arrayBuffer();
  let pdf;
  try{ pdf = await pdfjsLib.getDocument({data:buf}).promise; }
  catch(primaryErr){
    // Some browsers with strict privacy settings can block worker startup.
    // Retry without worker so parsing still succeeds.
    console.warn('[pdf] worker parse failed, retrying without worker', primaryErr);
    pdf = await pdfjsLib.getDocument({data:buf, disableWorker:true}).promise;
  }
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent(); const rows=[];
    tc.items.forEach(it=>{ if(it.str==null) return; const x=it.transform[4], y=it.transform[5];
      let row=rows.find(r=>Math.abs(r.y-y)<=3.2); if(!row){ row={y,parts:[]}; rows.push(row); } row.parts.push({x,str:it.str}); });
    rows.sort((a,b)=>b.y-a.y);
    pages.push(rows.map(r=>{ r.parts.sort((a,b)=>a.x-b.x); return r.parts.map(p=>p.str).join(" ").replace(/\s+/g," ").trim(); }).filter(Boolean));
  }
  return build(pages);
}
function build(pages){
  const meta=parseMeta(pages[0]||[]); const cats=[]; const byCode={};
  const isCat=l=>/^(\d{2})\s+\S/.test(l);
  const isCol=l=>l.replace(/\b(Purchase Name|Closing Quantity|Quantity|Closing|Unit|TOTAL|Name)\b/gi,"").replace(/[\s:]+/g,"")==="";
  const isNote=l=>/^notes\s*:?/i.test(l);
  const isMetaLine=t=>/^(Stock Count|Area Name|Site Name|Manager|Stock Type|Period Length|Printed|Page\s+\d+\s+of\s+\d+|Division|From|To|Area\s+\d+|Thread Name|Header)\b/i.test(t);
  const isValidTextCatName=t=>{ const s=(t||"").trim();
    if(!s||isCat(s)||isCol(s)||isNote(s)||isMetaLine(s)) return false;
    if(/[:\d]/.test(s)||s.length>40) return false;
    if(!/^[A-Za-z][A-Za-z '&\/-]*$/.test(s)) return false;
    return s.split(/\s+/).length<=4;
  };
  const inlineTextCat=line=>{ const t=(line||"").trim();
    const hdr=t.match(/Header:\s*Sub-Category\s+(.+)$/i); if(hdr&&isValidTextCatName(hdr[1])) return hdr[1].trim();
    const pre=t.split(/Purchase\s+Name/i)[0].trim(); if(pre!==t&&isValidTextCatName(pre)) return pre;
    return null;
  };
  const isTextCat=(line,nextLine)=>{ const t=(line||"").trim();
    if(!t||isCat(t)||isCol(t)||isNote(t)) return false;
    if(!nextLine||!isCol(nextLine)) return false;
    return isValidTextCatName(t);
  };
  const ensure=line=>{ const m=line.match(/^(\d{2})\s+(.+)$/); const code=m[1],name=m[2].trim();
    if(byCode[code]) return byCode[code]; const c={code,name,id:code,products:[]}; byCode[code]=c; cats.push(c); return c; };
  const ensureText=line=>{ const name=line.trim(),code="txt_"+slug(name);
    if(byCode[code]) return byCode[code]; const c={code,name,id:code,products:[]}; byCode[code]=c; cats.push(c); return c; };
  pages.forEach(lines=>{ let started=false,cur=null;
    for(let i=0;i<lines.length;i++){
      const line=lines[i], nextLine=lines[i+1]||"";
      const inlineCat=inlineTextCat(line);
      if(!started){ if(isCat(line)){ started=true; cur=ensure(line); }
        else if(inlineCat){ started=true; cur=ensureText(inlineCat); }
        else if(isTextCat(line,nextLine)){ started=true; cur=ensureText(line); }
        continue; }
      if(isCat(line)){ cur=ensure(line); continue; }
      if(inlineCat){ cur=ensureText(inlineCat); continue; }
      if(isTextCat(line,nextLine)){ cur=ensureText(line); continue; }
      if(isCol(line)||isNote(line)) continue;
      if(!cur) continue; const name=line.trim(); if(!name) continue;
      if(!cur.products.some(p=>p.name===name)) cur.products.push({id:cur.code+"|"+name, name});
    }});
  return {meta, categories:cats};
}
function parseMeta(lines){
  const all=lines.join("  "); const g=re=>{ const m=all.match(re); return m?m[1].trim():""; };
  const ft=all.match(/From:\s*([\d/]+)\s*To:\s*([\d/]+)/);
  return { division:g(/Division:\s*([A-Za-z][A-Za-z ]*?)(?:\s{2,}|Period|From|$)/)||"Stock",
    from:ft?ft[1]:"", to:ft?ft[2]:"", site:g(/Site Name:\s*(.+?)\s+Printed/)||g(/Site Name:\s*(.+?)$/),
    area:g(/Area Name:\s*(.+?)(?:\s+Stock Count|\s+Page|$)/), taker:g(/Stock Taker:\s*([A-Za-z]+)/),
    printed:g(/Printed\s*:\s*([\d/]+\s+[\d:]+)/) }; }
function sheetIdFor(m){ return "sh_"+slug([m.division,m.from,m.to,m.site].join("_")); }
function sheetLabel(m){ const a=[m.division,m.site||m.area].filter(Boolean).join(" · ");
  const d=(m.from&&m.to)?(m.from+"–"+m.to):""; return [a,d].filter(Boolean).join("  "); }

    );

          .map(e=>{ if(dirtyRef.current.has(e.id)||focusRef.current===e.id) return e;
            const r=sById[e.id]; return r?{id:r.id,expr:r.expr||"",counter:r.counter||""}:e; });
        const have=new Set(merged.map(e=>e.id));
        const hasPendingTemp=merged.some(e=>e.id&&e.id.startsWith('temp_'));
        if(!hasPendingTemp){
          serverArr.forEach(r=>{ if(!have.has(r.id)) merged.push({id:r.id,expr:r.expr||"",counter:r.counter||""}); });
        }
        const seen=new Set(); merged=merged.filter(e=>{ if(seen.has(e.id)) return false; seen.add(e.id); return true; });
        if(merged.length) next[pid]=merged; else delete next[pid];
      });
      return next;
    });
    const rcGrouped={};
    rcRows.forEach(r=>{ (rcGrouped[r.product_id]=rcGrouped[r.product_id]||[]).push({id:r.id,expr:r.expr||"",counter:r.counter||""}); });
    setRecountCounts(prev=>{

      });
      return next;
    });
  }

  async function flushQueue(){
    if(flushingRef.current) return;
    flushingRef.current=true;
    try{
    const raw=localStorage.getItem('tally_queue'); if(!raw) return;
    const queue=JSON.parse(raw); if(!queue.length) return;
    for(const item of queue){
      try{
        if(item.op==='insert'){
          const data=await upsertCount({client_id:item.clientId,session_id:item.sessionId,sheet_id:item.sheetId,product_id:item.pid,expr:item.expr,counter:item.counter,...(item.isRecount?{is_recount:true}:{})});
          const setter=item.isRecount?setRecountCounts:setCounts;
          setter(c=>({...c,[item.pid]:(c[item.pid]||[]).map(e=>e.id===item.tempId?{id:data.id,expr:item.expr,counter:item.counter}:e)}));
        } else if(item.op==='delete'&&!item.entryId.startsWith('temp_')){
          await sb.from("counts").delete().eq("id",item.entryId);
        } else if(item.op==='update'){
          await sb.from("counts").update({expr:item.expr,updated_at:new Date().toISOString()}).eq("id",item.entryId);
        }
        const live=JSON.parse(localStorage.getItem('tally_queue')||'[]');
        if(item.qid){
          localStorage.setItem('tally_queue',JSON.stringify(live.filter(x=>x.qid!==item.qid)));
        } else {
          let removed=false;
          localStorage.setItem('tally_queue',JSON.stringify(live.filter(x=>{
            if(removed) return true;
            const match=x.op===item.op&&(item.op==='insert'?x.tempId===item.tempId:x.entryId===item.entryId);
            if(match){ removed=true; return false; } return true;
          })));
        }
      }catch(e){ /* leave in queue for retry */ }
    }
    const live=JSON.parse(localStorage.getItem('tally_queue')||'[]');
    if(!live.length) localStorage.removeItem('tally_queue');
    setPendingCount(live.length);
    } finally { flushingRef.current=false; }
  }

  function setEntry(pid,id,expr){
    setCounts(c=>({...c,[pid]:(c[pid]||[]).map(e=>e.id===id?{...e,expr}:e)}));
    dirtyRef.current.add(id);
    clearTimeout(saveTs.current[id]);
    saveTs.current[id]=setTimeout(async()=>{
      const enqueueUpdate=()=>{
        const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
        const qid='q_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        const idx=q.findIndex(x=>x.op==='update'&&x.entryId===id);
        const item={op:'update',entryId:id,pid,expr,sessionId:session.id,qid};
        if(idx>=0) q[idx]=item; else q.push(item);
        localStorage.setItem('tally_queue',JSON.stringify(q));
        setPendingCount(q.length);
      };
      if(!navigator.onLine){ enqueueUpdate(); dirtyRef.current.delete(id); return; }
      try{
        await sb.from("counts").update({expr,updated_at:new Date().toISOString()}).eq("id",id);
        dirtyRef.current.delete(id);

  async function delEntry(pid,id){
    dirtyRef.current.delete(id);
    setCounts(c=>({...c,[pid]:(c[pid]||[]).filter(e=>e.id!==id)}));
    if(id.startsWith('temp_')){
      const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
      localStorage.setItem('tally_queue',JSON.stringify(q.filter(x=>!(x.op==='insert'&&x.tempId===id))));
      setPendingCount(JSON.parse(localStorage.getItem('tally_queue')||'[]').length);
      return;
    }
    const enqueue=()=>{
      const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
      q.push({op:'delete',entryId:id,pid,sessionId:session.id,qid:'q_'+Date.now()+'_'+Math.random().toString(36).slice(2)});
      localStorage.setItem('tally_queue',JSON.stringify(q));
      setPendingCount(q.length);
    };
    if(!navigator.onLine){ enqueue(); return; }
    try{ await sb.from("counts").delete().eq("id",id); }catch(e){ enqueue(); }
  }
  function toggle(pid){ setOpen(o=>({...o,[pid]:!o[pid]})); }
  async function toggleFlag(pid){
    const n=new Set(flagged); n.has(pid)?n.delete(pid):n.add(pid);
    const arr=[...n]; setFlagged(n);
    localStorage.setItem('tally_flagged_'+session.id,JSON.stringify(arr));
    flagDirtyRef.current=true;
    await sb.from("sessions").update({flagged_products:arr}).eq("id",session.id);
    flagDirtyRef.current=false;
  }
  async function addRecountEntry(pid, expr){
    const v=String(expr||"").trim(); if(!v) return;
    const tempId='temp_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const clientId=newClientId();
    setRecountCounts(c=>({...c,[pid]:[...(c[pid]||[]),{id:tempId,expr:v,counter}]}));
    setDrafts(d=>({...d,[pid]:""})); playSubmitSound();
    const enqueue=()=>{
      const qid='q_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
      q.push({op:'insert',tempId,clientId,pid,expr:v,counter,sessionId:session.id,sheetId:sheet.id,isRecount:true,qid});
      localStorage.setItem('tally_queue',JSON.stringify(q));
      const cached=JSON.parse(localStorage.getItem('tally_counts_'+session.id)||'[]');
      cached.push({id:tempId,product_id:pid,expr:v,counter,session_id:session.id,sheet_id:sheet.id,is_recount:true});
      localStorage.setItem('tally_counts_'+session.id,JSON.stringify(cached));
      setPendingCount(q.length);
      if('serviceWorker' in navigator && 'SyncManager' in window) navigator.serviceWorker.ready.then(r=>r.sync.register('tally-flush').catch(()=>{}));
    };
    if(!navigator.onLine){ enqueue(); flash("Saved offline — will sync when online"); return; }
    try{
      const data=await upsertCount({client_id:clientId,session_id:session.id,sheet_id:sheet.id,product_id:pid,expr:v,counter,is_recount:true});
      setRecountCounts(c=>({...c,[pid]:(c[pid]||[]).map(e=>e.id===tempId?{id:data.id,expr:v,counter}:e)}));
    }catch(e){ enqueue(); flash("Saved offline — will sync when online"); }
  }
  async function delRecountEntry(pid, id){
    setRecountCounts(c=>({...c,[pid]:(c[pid]||[]).filter(e=>e.id!==id)}));
    if(id.startsWith('temp_')){
      const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
      localStorage.setItem('tally_queue',JSON.stringify(q.filter(x=>!(x.op==='insert'&&x.tempId===id))));
      setPendingCount(JSON.parse(localStorage.getItem('tally_queue')||'[]').length);
      return;
    }
    const enqueue=()=>{
      const q=JSON.parse(localStorage.getItem('tally_queue')||'[]');
      q.push({op:'delete',entryId:id,pid,sessionId:session.id,qid:'q_'+Date.now()+'_'+Math.random().toString(36).slice(2)});
      localStorage.setItem('tally_queue',JSON.stringify(q));
      setPendingCount(q.length);
    };
    if(!navigator.onLine){ enqueue(); return; }
    try{ await sb.from("counts").delete().eq("id",id); }catch(e){ enqueue(); }
  }
  function appendOp(pid,ch){ setDrafts(d=>({...d,[pid]:(d[pid]||'')+ch})); }
  function saveCounter(v){ setCounter(v); localStorage.setItem("tally_counter",v); }
  function playSubmitSound(){
    if(!soundOn) return;
    try{
      if(!audioCtxRef.current||audioCtxRef.current.state==='closed') audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
      const ctx=audioCtxRef.current; if(ctx.state==='suspended') ctx.resume();
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type='sine'; osc.frequency.value=880;
      gain.gain.setValueAtTime(0.18,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
      osc.start(); osc.stop(ctx.currentTime+0.12);
    }catch(e){}
  }

  async function delSheetTemplate(id,e){ e&&e.stopPropagation();
    if(!confirm("Delete this saved count sheet? Any counts made from it are removed too.")) return;
    await sb.from("sheets").delete().eq("id",id); await Promise.all([loadSheets(),loadSessions()]); }
  async function delSessionRow(id,e){ e&&e.stopPropagation();
    if(!confirm("Delete this count and all its entries?")) return;
    await sb.from("sessions").delete().eq("id",id); await loadSessions(); }
  async function delCurrentSession(){
    if(!confirm("Delete this count and all its entries? (The count sheet stays for reuse.)")) return;
    const id=session.id; setMenu(false); goHome(); await sb.from("sessions").delete().eq("id",id); await loadSessions(); }

  function exportCsv(){
    const rows=[["Category","Product","Total"]];
    sheet.categories.forEach(c=>c.products.forEach(p=>{ const t=productTotal(p.id); if(t!==0||showAll) rows.push([c.code+" "+c.name,p.name,fmt(t)]); }));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="totals_"+slug(sheet.label)+".csv"; a.click(); setMenu(false); flash("Totals exported");
  }

  flushQueueRef.current=flushQueue;

  function renderProw(p, catBadge=null, isRecount=false){
    const es = isRecount ? (recountCounts[p.id]||[]) : entriesOf(p.id);
    const t = isRecount ? es.reduce((a,e)=>{ const r=evalExpr(e.expr); return a+(isFinite(r.v)?r.v:0); },0) : productTotal(p.id);
    const isOpen=!!open[p.id]; const draft=drafts[p.id]||""; const isFlagged=flagged.has(p.id);
    const doAdd=()=>{ isRecount ? addRecountEntry(p.id,draft) : addQuickEntry(p.id,draft); };
    const doDel=(id)=>{ isRecount ? delRecountEntry(p.id,id) : delEntry(p.id,id); };
    return (<div className={"prow"+(isOpen?" open":"")+(isFlagged?" flagged":"")+(p.id===lastPid?" last":"")} key={p.id}>
      <div className="phead">
        <div className="phead-toggle" onClick={()=>toggle(p.id)}><span className="pchev">▶</span>
          <span className={"pname"+(focusedPid===p.id?" focused":"")}>{p.name}</span>{catBadge && <span className="cat-badge">{catBadge}</span>}</div>
        <input className="pinput" value={draft} placeholder="qty" inputMode="decimal"
          autoCapitalize="off" autoCorrect="off" onClick={e=>e.stopPropagation()}
          onFocus={()=>setFocusedPid(p.id)} onBlur={()=>setFocusedPid(null)}
          onChange={e=>setDrafts(d=>({...d,[p.id]:e.target.value}))}
          onKeyDown={e=>{ if(e.key==="Enter"){e.preventDefault();doAdd();} }}/>
        <button className="padd" onClick={e=>{e.stopPropagation();doAdd();}}>+</button>
        <button className={"pflag"+(isFlagged?" on":"")} onClick={e=>{e.stopPropagation();toggleFlag(p.id);}}>⚑</button>
        <span className={"ptot"+(t===0?" zero":"")}>{t===0?"0":fmt(t)}</span>
      </div>
      {focusedPid===p.id && (<div className="oprow" onClick={e=>e.stopPropagation()}>
        {[['×','*'],['+','+'],['\u2212','-'],['÷','/']].map(([label,ch])=>(
          <button key={ch} className="opbtn"
            onPointerDown={e=>e.preventDefault()} onMouseDown={e=>e.preventDefault()}
            onClick={()=>appendOp(p.id,ch)}>{label}</button>))}
      </div>)}
      {isOpen && (<div className="pbody">
        {es.length===0 && <div style={{color:"var(--muted)",fontSize:12,padding:"4px 0"}}>No entries yet.</div>}
        {es.map(e=>{ const r=evalExpr(e.expr); const showEq=/[-+*/()]/.test(e.expr)&&!r.empty; const bad=!r.empty&&!isFinite(r.v);
          return (<div className="erow" key={e.id}>
            <span className="eexpr">{e.expr||"—"}</span>
            {showEq && <span className={"eeq"+(bad?" bad":"")}>{bad?"?":"= "+fmt(r.v)}</span>}
            {!isRecount && e.counter && <span className="eby">{e.counter}</span>}
            <button className="edel" onClick={()=>doDel(e.id)}>×</button></div>); })}
        <div className="psub"><span>{es.length} {es.length===1?"entry":"entries"}</span><b>{fmt(t)}</b></div></div>)}
    </div>);
  }

  const authPanelJsx = authPanel && (<div className="scrim" onClick={()=>setAuthPanel(null)}>
    <div className="panel" onClick={e=>e.stopPropagation()}><div className="grip"></div>
      <div className="ptitle disp">{authPanel.mode==='create'?'Start count':'Join count'}</div>
      <div style={{fontSize:13,color:'var(--muted)',marginBottom:14}}>{authPanel.label}</div>
      {!counter && <div className="field"><label>Your name</label>
        <input value={authName} placeholder="e.g. Steve" autoFocus
          onChange={e=>{ setAuthName(e.target.value); setAuthError(''); }}/></div>}
      {authPanel.mode==='create' ? (<>
        <div className="field"><label>Set a PIN</label>
          <input value={authPin} type="tel" inputMode="numeric" maxLength={4} placeholder="4 digits"
            onChange={e=>{ setAuthPin(e.target.value.replace(/\D/g,'').slice(0,4)); setAuthError(''); }}/></div>
        <div className="field"><label>Confirm PIN</label>
          <input value={authPinConfirm} type="tel" inputMode="numeric" maxLength={4} placeholder="Repeat PIN"
            onChange={e=>{ setAuthPinConfirm(e.target.value.replace(/\D/g,'').slice(0,4)); setAuthError(''); }}/></div>
      </>) : (
        <div className="field"><label>PIN</label>
          <input value={authPin} type="tel" inputMode="numeric" maxLength={4} placeholder="Leave blank if no PIN set"
            onChange={e=>{ setAuthPin(e.target.value.replace(/\D/g,'').slice(0,4)); setAuthError(''); }}/></div>
      )}
      {authError && <div style={{color:'var(--bad)',fontSize:13,marginBottom:10}}>{authError}</div>}
      <button className="cta" onClick={handleAuthConfirm}>{authPanel.mode==='create'?'Start counting':'Join count'}</button>
      <button className="cta ghost" style={{marginTop:8}} onClick={()=>setAuthPanel(null)}>Cancel</button>
    </div></div>);
  const toastJsx = toast ? <div className="toast">{toast}</div> : null;

  if(!CONFIGURED) return (<><div className="config"><h2 className="disp">Almost there</h2>
    <p style={{fontSize:14,lineHeight:1.5}}>Open <code>index.html</code> and paste your Supabase key into the <code>TALLY_CONFIG</code> block near the top, replacing <code>PASTE_YOUR_KEY_HERE</code>. Then redeploy.</p></div>{toastJsx}</>);

  if(!ready || (busy && view!=="count")) return (<><div style={{padding:"80px 20px",textAlign:"center"}}>
    <div className="spin"></div><div style={{color:"var(--muted)",fontSize:14}}>{busy?"Working…":"Connecting…"}</div></div>{toastJsx}</>);

  /* HOME */
  if(view==="home") return (<>
    <div className="hero">
      <h1 className="disp">Stock counts,<br/><em>without the paper.</em></h1>
      <p>Start a fresh count from one of your sheets, or join a count already in progress with your team.</p>
      <button className="bigcard alt" onClick={goPick}>
        <span className="ic">▶</span>
        <span><span className="t1">Start new count</span><span className="t2">Pick a count sheet (or upload one) and begin a new count</span></span></button>
      <button className="bigcard" onClick={goJoin}>
        <span className="ic">↪</span>
        <span><span className="t1">Join a count</span><span className="t2">Open an ongoing or past count and add your numbers</span></span></button>
    </div>{toastJsx}</>);

  /* PICK SHEET (start) */
  if(view==="pick") return (<>
    <div className="topbar"><button className="iconbtn" onClick={goHome}>‹</button>
      <div className="brand"><div className="b1 disp">New <em>count</em></div><div className="b2">Choose a count sheet to begin</div></div></div>
    <div className="body">
      <div className="drop" onClick={()=>fileRef.current.click()}>
        <div className="big disp">Upload a new count sheet</div>
        <div className="sm">PDF · categories &amp; products detected automatically</div>
        <div className="sm" style={{marginTop:4,opacity:.75}}>Build {BUILD_ID}</div>
        {uploadStatus && <div className="sm" style={{marginTop:6,color:"var(--accent2)",fontWeight:600}}>{uploadStatus}</div>}
        <button className="cta" type="button">Choose PDF</button></div>
      <input ref={fileRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={onFile}/>
      <div className="libttl">Use a saved sheet</div>
      {sheets.length===0 && <div className="empty"><div className="e1">🗒️</div>No saved sheets yet — upload one above.</div>}
      {sheets.map(s=>(<div className="lib" key={s.id} onClick={()=>startSession(s.id,s.label)}>
        <div style={{flex:1,minWidth:0}}><div className="l1">{s.label}</div>
          <div className="l2">{s.cat_count} categories · {s.prod_count} products · uploaded {new Date(s.created_at).toLocaleDateString()}</div></div>
        <button className="ldel" onClick={e=>delSheetTemplate(s.id,e)}>×</button></div>))}
      </div>{authPanelJsx}{toastJsx}</>);

  /* PREVIEW */
  if(view==="preview" && preview){ const tot=preview.categories.reduce((a,c)=>a+c.products.length,0);
    return (<>
      <div className="topbar"><button className="iconbtn" onClick={()=>{setPreview(null);setView("pick");}}>‹</button>
        <div className="brand"><div className="b1 disp">Check &amp; <em>confirm</em></div>
          <div className="b2">{preview.categories.length} categories · {tot} products found</div></div></div>
      <div className="body">
        <div style={{background:"var(--card)",border:"1px solid var(--line)",borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:15}}>{preview.label||"Count sheet"}</div>
          <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>
            {preview.meta.taker && <>Stock taker: {preview.meta.taker} · </>}{preview.meta.printed && <>printed {preview.meta.printed}</>}</div></div>
        <div className="pvwrap">{preview.categories.map(c=>(<div key={c.id}>
          <div className="pvcat"><span className="n">{c.code}</span>{c.name}<span className="c">{c.products.length}</span></div>
          {c.products.map(p=><div className="pvp" key={p.id}>{p.name}</div>)}</div>))}</div></div>
      <div style={{position:"sticky",bottom:0,padding:"12px 14px",background:"var(--paper)",borderTop:"1px solid var(--line)"}}>
        <button className="cta" onClick={confirmImport}>Save sheet &amp; start counting</button>
        <button className="cta ghost" style={{marginTop:8}} onClick={()=>{setPreview(null);setView("pick");}}>Cancel</button></div>{toastJsx}</>); }

  /* JOIN (sessions list) */
  if(view==="join") return (<>
    <div className="topbar"><button className="iconbtn" onClick={goHome}>‹</button>
      <div className="brand"><div className="b1 disp">Join a <em>count</em></div><div className="b2">Most recent first</div></div></div>
    <div className="body">
      {sessions.length===0 && <div className="empty"><div className="e1">📋</div>No counts yet. Start one from the home screen.</div>}
      {sessions.map(s=>(<div className="lib" key={s.id} onClick={()=>{
        setAuthName(counter); setAuthPin(localStorage.getItem('tally_pin_'+s.id)||''); setAuthPinConfirm(''); setAuthError('');
        setAuthPanel({mode:'join', id:s.id, label:s.label});
      }}>
        <div style={{flex:1,minWidth:0}}><div className="l1">{s.label}</div>
          <div className="l2">Started {when(s.created_at)}</div>
          {sessionCounters[s.id]?.length>0 && <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:5}}>
            {sessionCounters[s.id].map(n=><span key={n} className="eby">{n}</span>)}</div>}</div>
        <button className="ldel" onClick={e=>delSessionRow(s.id,e)}>×</button></div>))}
      </div>{authPanelJsx}{toastJsx}</>);

  /* COUNT */
  if(view==="count" && sheet && session){
    const cats=sheet.categories; const isTot=activeCat==="totals"; const cat=cats.find(c=>c.id===activeCat);
    const grand=cats.reduce((a,c)=>a+c.products.reduce((s,p)=>s+productTotal(p.id),0),0);
    const recountProducts=cats.flatMap(c=>c.products.filter(p=>flagged.has(p.id)).map(p=>({...p,catCode:c.code,catName:c.name})));
    return (<><div className="count-shell">
      <div className="topbar"><button className="iconbtn" onClick={goHome}>‹</button>
        <div className="brand"><div className="b1 disp">{sheet.label}</div><div className="b2">Count started {when(session.created_at)}</div></div>
        <div className="live"><span className={"dot"+(isOnline?(synced?" on":""):" offln")}></span>{isOnline?(synced?(pendingCount>0?`${pendingCount} syncing…`:"Auto-sync"):(pendingCount>0?`${pendingCount} pending`:"…")):(pendingCount>0?`Offline · ${pendingCount} pending`:"Offline")}</div>
        <button className="iconbtn" onClick={()=>setMenu(true)}>⋯</button></div>
      <div className="tabs">
        {cats.map(c=>{ const cnt=c.products.filter(p=>productTotal(p.id)!==0).length;
          return (<button key={c.id} className={"tab"+(activeCat===c.id?" on":"")} onClick={()=>setActiveCat(c.id)}>
            <span className="num">{c.code}</span>{c.name}{cnt>0 && <span className="cnt">{cnt}</span>}</button>); })}
        {flagged.size>0 && <button className={"tab recount"+(activeCat==='recounts'?" on":"")} onClick={()=>setActiveCat('recounts')}>⚑ Recounts<span className="cnt">{flagged.size}</span></button>}
        <button className={"tab tot"+(isTot?" on":"")} onClick={()=>setActiveCat("totals")}>Σ Totals</button></div>
      <div className="count-scroll">
        {!isTot && activeCat!=='recounts' && cat && (<>
          <div className="cathead disp"><span className="num">{cat.code}</span>{cat.name}</div>
          {cat.products.map(p=>renderProw(p))}
        </>)}
        {activeCat==='recounts' && (<>
          <div className="cathead disp" style={{color:'var(--bad)'}}>⚑ Flagged for recount</div>
          {recountProducts.length===0 && <div className="empty"><div className="e1">⚑</div>No items flagged yet — tap ⚑ on any product.</div>}
          {recountProducts.map(p=>renderProw(p, p.catCode, true))}
        </>)}
        {isTot && (<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"6px 4px 2px"}}>
            <div className="libttl" style={{margin:0}}>Totals · sheet order</div></div>
          {cats.map(c=>{ const prods=c.products; if(!prods.length) return null;
            const sub=c.products.reduce((a,p)=>a+productTotal(p.id),0);
            return (<div key={c.id}><div className="tcat disp"><span><span style={{color:"var(--accent)",fontSize:12}}>{c.code}</span> {c.name}</span><span className="ts">{fmt(sub)}</span></div>
              {prods.map(p=>(<div className="trow" key={p.id}><span className="tn">{p.name}</span><span className="tv">{fmt(productTotal(p.id))}</span></div>))}</div>); })}
          {grand===0 && <div className="empty"><div className="e1">📦</div>No counts entered yet.</div>}</>)}
      </div>
      {menu && (<div className="scrim" onClick={()=>setMenu(false)}>
        <div className="panel" onClick={e=>e.stopPropagation()}><div className="grip"></div>
          <div className="ptitle disp">Count options</div>
          <div className="field"><label>Your name (tags your entries)</label>
            <input value={counter} placeholder="e.g. Steve" onChange={e=>saveCounter(e.target.value)}/></div>
          <button className="mbtn" onClick={()=>{ const v=!soundOn; setSoundOn(v); localStorage.setItem('tally_sound',v?'on':'off'); }}>
            {soundOn ? '♪ Entry sound: On' : '♪ Entry sound: Off'}</button>
          <button className="mbtn" onClick={exportCsv}>⤓ Export totals (CSV)</button>
          <button className="mbtn danger" onClick={delCurrentSession}>Delete this count</button>
          <div style={{fontSize:11,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>Everyone who joins this count adds into the same totals, re-synced every few seconds. Share the web address and have each person set their name.</div>
        </div></div>)}
    </div>{toastJsx}</>); }
  return null;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
